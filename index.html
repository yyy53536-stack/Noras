
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EMO-AI Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    input[type="text"], input[type="password"], textarea {
      user-select: text;
    }

    /* Smooth slide transitions for AI Chat & Settings drawers */
    .drawer-sheet {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }
    .drawer-closed {
      transform: translateY(105%);
      opacity: 0;
      pointer-events: none;
    }
    .drawer-open {
      transform: translateY(0%);
      opacity: 1;
      pointer-events: auto;
    }

    /* Custom subtle scrollbar for chat history */
    #chatMessages::-webkit-scrollbar {
      width: 4px;
    }
    #chatMessages::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.3);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-black overflow-hidden relative">

  <!-- Hidden Computer Vision Elements -->
  <video id="visionVideo" autoplay playsinline muted class="hidden"></video>
  <canvas id="visionProcCanvas" width="64" height="48" class="hidden"></canvas>

  <!-- 100% Pure Pitch-Black Full-Screen Canvas (Eyes + Top Robotic Ears Only) -->
  <canvas id="emoCanvas"></canvas>

  <!-- Floating Glassmorphic Bottom Action Bar (Clear AI Chat & Settings Access) -->

    <div class="pointer-events-auto flex items-center gap-2.5 bg-zinc-950/80 backdrop-blur-xl border border-zinc-800/90 px-3 py-2 rounded-full shadow-[0_10px_35px_rgba(0,0,0,0.9)]">
      <!-- Primary AI Chat & Voice Button -->
      <button id="btnOpenChat" class="flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-gradient-to-l from-cyan-400 to-blue-500 text-black font-black text-xs sm:text-sm shadow-lg shadow-cyan-500/20 active:scale-95 transition">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />

        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" />
        </svg>
      </button>

          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />

      <div class="w-16 h-16 mx-auto rounded-2xl bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center text-3xl">
        <span>&#129302;</span>
      </div>
      <div>

        <p id="lblPermDesc" class="text-xs text-zinc-400 leading-relaxed"></p>
      </div>

      <div class="space-y-2.5 text-right">
        <!-- 1. Camera -->
        <div class="flex items-center justify-between bg-zinc-900/90 p-3 rounded-2xl border border-zinc-800">
          <div class="flex items-center gap-3">
            <span class="text-xl">&#128065;&#65039;</span>
            <div>
              <div id="lblCamTitle" class="text-sm font-bold text-white"></div>
              <div id="lblCamSub" class="text-[11px] text-zinc-400"></div>
            </div>
          </div>
          <button id="btnPermCam" class="px-3.5 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs active:scale-95 transition shrink-0"></button>
        </div>

        <!-- 2. Microphone -->
        <div class="flex items-center justify-between bg-zinc-900/90 p-3 rounded-2xl border border-zinc-800">
          <div class="flex items-center gap-3">
            <span class="text-xl">&#127897;&#65039;</span>
            <div>
              <div id="lblMicTitle" class="text-sm font-bold text-white"></div>
              <div id="lblMicSub" class="text-[11px] text-zinc-400"></div>
            </div>
          </div>
          <button id="btnPermMic" class="px-3.5 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs active:scale-95 transition shrink-0"></button>
        </div>

        <!-- 3. Motion & Gyroscope -->

          <div class="flex items-center gap-3">
            <span class="text-xl">&#128241;</span>
            <div>

      </div>

        <div class="grid grid-cols-6 gap-2">

      </div>
    </div>
  </div>

    // ============================================================================
    // 1. PROCEDURAL ROBOTIC SOUND SYNTHESIZER (WEB AUDIO API)
    // ============================================================================
    class EmoSound {
      constructor() {
        this.ctx = null;
      }

      unlock() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      tone(f1, f2, dur, type = 'sine', vol = 0.16, delay = 0) {
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(f1, now);
        if (f2 !== f1) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(25, f2), now + dur);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + dur * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      playCue(cue) {
        switch (cue) {
          case 'chirp_happy':
            this.tone(560, 960, 0.11, 'sine', 0.16, 0);
            this.tone(860, 1340, 0.16, 'triangle', 0.15, 0.1);
            break;
          case 'giggle':
            for (let i = 0; i < 4; i++) {
              this.tone(720 + i * 90, 980 + i * 90, 0.08, 'sine', 0.14, i * 0.09);
            }
            break;
          case 'love_chime':
            this.tone(440, 660, 0.15, 'sine', 0.14, 0);
            this.tone(660, 880, 0.18, 'sine', 0.14, 0.12);
            this.tone(880, 1180, 0.25, 'sine', 0.15, 0.25);
            break;
          case 'beep_curious':
            this.tone(380, 760, 0.22, 'sine', 0.14, 0);
            break;
          case 'gasp':
            this.tone(480, 1120, 0.16, 'triangle', 0.16, 0);
            break;
          case 'sigh':
            this.tone(420, 190, 0.38, 'sine', 0.13, 0);
            break;
          case 'angry_buzz':
            this.tone(210, 125, 0.26, 'sawtooth', 0.16, 0);
            this.tone(190, 110, 0.22, 'sawtooth', 0.15, 0.22);
            break;
          case 'dance_beat':
            [330, 440, 554, 659, 554, 659, 880].forEach((n, idx) => {
              this.tone(n, n * 1.04, 0.11, 'triangle', 0.14, idx * 0.12);
            });
            break;
          case 'sleep_snore':
            this.tone(160, 120, 0.45, 'sine', 0.10, 0);
            this.tone(120, 180, 0.45, 'sine', 0.09, 0.55);
            break;
          case 'purr':
            this.tone(130, 175, 0.18, 'triangle', 0.13, 0);
            this.tone(150, 200, 0.22, 'triangle', 0.13, 0.15);
            break;
          case 'dizzy':
            for (let i = 0; i < 4; i++) {
              this.tone(640 - i * 80, 310 + i * 70, 0.11, 'sine', 0.12, i * 0.09);
            }
            break;
          case 'listen':
            this.tone(520, 820, 0.09, 'sine', 0.13, 0);
            break;
          case 'blink':
            this.tone(650, 510, 0.04, 'sine', 0.05, 0);
            break;
          default:
            this.tone(520, 740, 0.12, 'sine', 0.12, 0);
        }
      }
    }

    // ============================================================================
    // 2. SPEECH & VOICE ENGINE (ARABIC STT + EXPRESSIVE TTS)
    // ============================================================================
    class EmoVoice {
      constructor(emo) {
        this.emo = emo;
        this.recognition = null;
        this.isListening = false;
        this.isSpeaking = false;
        this.continuousMode = true;
        this.micGranted = false;
        this.setupRecognition();
      }

      setupRecognition() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;

        this.recognition = new SpeechRec();
        this.recognition.lang = 'ar-SA';
        this.recognition.continuous = false;
        this.recognition.interimResults = false;

        this.recognition.onstart = () => {
          this.isListening = true;
          document.getElementById('micPulseRing')?.classList.remove('hidden');
          if (!this.isSpeaking) {
            this.emo.face.setEmotion('listening', 0);
            this.emo.face.setEarAction('alert_scan');
            this.emo.sound.playCue('listen');
          }
        };

        this.recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.trim();
          if (transcript) {
            this.emo.brain.processInput(transcript, 'voice');
          }
        };

        this.recognition.onerror = () => {
          this.isListening = false;
          document.getElementById('micPulseRing')?.classList.add('hidden');
          if (this.emo.face.emotion === 'listening') {
            this.emo.face.setEmotion('neutral');
          }
        };

        this.recognition.onend = () => {
          this.isListening = false;
          document.getElementById('micPulseRing')?.classList.add('hidden');
          if (this.emo.face.emotion === 'listening') {
            this.emo.face.setEmotion('neutral');
          }
          if (this.continuousMode && this.micGranted && !this.isSpeaking && !this.emo.brain.isThinking) {
            setTimeout(() => this.startListening(), 500);
          }
        };
      }

      async requestPermission() {
        this.emo.sound.unlock();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          this.micGranted = true;
          return true;
        } catch {
          return false;
        }
      }

      startListening() {
        if (!this.recognition || this.isListening || this.isSpeaking) return;
        try {
          this.recognition.start();
        } catch (e) {}
      }

      stopListening() {
        if (this.recognition && this.isListening) {
          try {
            this.recognition.stop();
          } catch (e) {}
        }
      }

      speak(text) {
        if (!('speechSynthesis' in window)) return;
        this.stopListening();
        window.speechSynthesis.cancel();

        const clean = text.replace(/[\u{1F600}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F300}-\u{1F5FF}]/gu, '').trim();
        if (!clean) return;

        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'ar-SA';
        utter.pitch = 1.35;
        utter.rate = 1.05;

        const voices = window.speechSynthesis.getVoices();
        const arVoice = voices.find(v => v.lang.includes('ar-SA') || v.lang.includes('ar-JO') || v.lang.includes('ar'));
        if (arVoice) utter.voice = arVoice;

        utter.onstart = () => {
          this.isSpeaking = true;
        };

        utter.onend = () => {
          this.isSpeaking = false;
          if (this.continuousMode && this.micGranted) {
            setTimeout(() => this.startListening(), 450);
          }
        };

        utter.onerror = () => {
          this.isSpeaking = false;
          if (this.continuousMode && this.micGranted) {
            setTimeout(() => this.startListening(), 650);
          }
        };

        window.speechSynthesis.speak(utter);
      }
    }

    // ============================================================================
    // 3. COMPUTER VISION ENGINE (USER TRACKING & DARKNESS DETECTION)
    // ============================================================================
    class EmoVision {
      constructor(emo) {
        this.emo = emo;
        this.active = false;
        this.video = document.getElementById('visionVideo');
        this.canvas = document.getElementById('visionProcCanvas');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        this.prevFrame = null;
        this.darkCount = 0;
        this.isDark = false;
        this.lastMotionDetected = false;
        this.lastAiReaction = 0;
      }

      async requestPermission() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: 160, height: 120 },
            audio: false
          });
          this.video.srcObject = stream;
          await this.video.play();
          this.active = true;
          this.process();
          return true;
        } catch {
          return false;
        }
      }

      getSensoryDescription() {
        if (!this.active) return 'Camera off';
        if (this.isDark) return 'Room is completely dark or lens covered';
        return this.lastMotionDetected ? 'User moving in front of camera' : 'Room lit and calm';
      }

      process() {
        if (!this.active) return;
        const w = this.canvas.width;
        const h = this.canvas.height;

        this.ctx.save();
        this.ctx.scale(-1, 1);
        this.ctx.drawImage(this.video, -w, 0, w, h);
        this.ctx.restore();

        const data = this.ctx.getImageData(0, 0, w, h).data;
        let lumSum = 0;
        let sumX = 0, sumY = 0, weight = 0;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
            lumSum += lum;

            if (this.prevFrame) {
              const pLum = (this.prevFrame[i] + this.prevFrame[i + 1] + this.prevFrame[i + 2]) / 3;
              const diff = Math.abs(lum - pLum);
              if (diff > 20) {
                sumX += x * diff;
                sumY += y * diff;
                weight += diff;
              }
            }
          }
        }

        const avgLum = lumSum / (w * h);
        const now = Date.now();

        if (avgLum < 15) {
          this.darkCount++;
          if (this.darkCount > 24 && !this.isDark) {
            this.isDark = true;
            if (now - this.lastAiReaction > 8000) {
              this.lastAiReaction = now;
              this.emo.brain.processInput(AR.sensorDark, 'sensor');
            }
          }
        } else {
          if (this.isDark && avgLum > 32) {
            this.isDark = false;
            if (now - this.lastAiReaction > 6000) {
              this.lastAiReaction = now;
              this.emo.brain.processInput(AR.sensorLight, 'sensor');
            }
          }
          this.darkCount = 0;
        }

        if (weight > 750 && !this.isDark) {
          this.lastMotionDetected = true;
          const nx = ((sumX / weight) / w) * 2 - 1;
          const ny = ((sumY / weight) / h) * 2 - 1;
          this.emo.face.userGazeX = nx * 1.35;
          this.emo.face.userGazeY = ny * 1.15;
          if (this.emo.face.gazeMode === 'user') {
            this.emo.face.setLookTarget(this.emo.face.userGazeX, this.emo.face.userGazeY);
          }
        } else {
          this.lastMotionDetected = false;
        }

        this.prevFrame = new Uint8ClampedArray(data);
        requestAnimationFrame(() => this.process());
      }
    }

    // ============================================================================
    // 4. MOTION & GYROSCOPE ENGINE
    // ============================================================================
    class EmoSensors {
      constructor(emo) {
        this.emo = emo;
        this.active = false;
        this.lastShake = 0;
        this.tiltState = 'upright';
      }

      async requestPermission() {
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') return false;
          }
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
          }
        } catch {
          return false;
        }

        if (!this.active) {
          window.addEventListener('deviceorientation', (e) => this.onTilt(e));
          window.addEventListener('devicemotion', (e) => this.onShake(e));
          this.active = true;
        }
        return true;
      }

      onTilt(e) {
        if (e.gamma === null || e.beta === null) return;
        const tx = Math.max(-1, Math.min(1, e.gamma / 32));
        const ty = Math.max(-1, Math.min(1, (e.beta - 45) / 32));
        if (!this.emo.vision.active && this.emo.face.gazeMode === 'user') {
          this.emo.face.setLookTarget(tx, ty);
        }
        this.emo.face.gravityTilt = tx;
        this.tiltState = Math.abs(tx) > 0.55 ? (tx > 0 ? 'tilted right' : 'tilted left') : 'upright';
      }

      onShake(e) {
        const acc = e.accelerationIncludingGravity || e.acceleration;
        if (!acc) return;
        const mag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
        const now = Date.now();
        if (mag > 24 && now - this.lastShake > 5500) {
          this.lastShake = now;
          this.emo.face.setEmotion('dizzy', 4.0);
          this.emo.sound.playCue('dizzy');
          this.emo.face.spawnParticles('STAR', 7);
          this.emo.brain.processInput(AR.sensorShake, 'sensor');
        }
      }
    }

        const dpr = window.devicePixelRatio || 1;
        this.w = window.innerWidth;
        this.h = window.innerHeight;
        this.canvas.width = this.w * dpr;
        this.canvas.height = this.h * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      getActiveColor() {
        if (this.overrideTimer > 0 && this.overrideColor) {
          return this.overrideColor;
        }
        if (this.baseColor === 'RAINBOW') {
          const hue = (this.time * 55) % 360;
          return `hsl(${hue}, 100%, 58%)`;
        }
        return this.baseColor;
      }

      setBaseColor(hex) {
        this.baseColor = hex;
        localStorage.setItem('emo_color', hex);
      }

      setOverrideColor(hex, duration = 4.5) {
        if (hex && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
          this.overrideColor = hex;
          this.overrideTimer = duration;
        }
      }

      setLookTarget(x, y) {
        this.targetLookX = Math.max(-1, Math.min(1, x));
        this.targetLookY = Math.max(-1, Math.min(1, y));
      }

      setGazeMode(mode) {
        this.gazeMode = mode;
        switch (mode) {
          case 'left': this.setLookTarget(-0.85, 0); break;
          case 'right': this.setLookTarget(0.85, 0); break;
          case 'up': this.setLookTarget(0, -0.75); break;
          case 'down': this.setLookTarget(0, 0.75); break;
          case 'center': this.setLookTarget(0, 0); break;
          case 'user': this.setLookTarget(this.userGazeX, this.userGazeY); break;
          case 'random_scan':
            this.setLookTarget((Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.1);
            break;
        }
      }

      setEmotion(emo, duration = 0) {
        this.emotion = (emo || 'neutral').toLowerCase();
        this.emotionTimer = duration;
      }

      setEarAction(action) {
        this.earAction = (action || 'idle').toLowerCase();
      }

      spawnParticles(type, count = 4) {
        const cx = this.w / 2;
        const cy = this.h * 0.45;
        for (let i = 0; i < count; i++) {
          this.particles.push({
            type,
            x: cx + (Math.random() - 0.5) * (this.w * 0.65),
            y: cy + (Math.random() - 0.5) * 90,
            vx: (Math.random() - 0.5) * 1.6,
            vy: -1.4 - Math.random() * 1.6,
            size: 18 + Math.random() * 10,
            alpha: 1
          });
        }
      }

      bindGestures() {
        const getXY = (e) => {
          const t = e.touches ? e.touches[0] : e;
          return { x: t.clientX, y: t.clientY };
        };

        const onDown = (e) => {
          this.emo.sound.unlock();
          const { x, y } = getXY(e);
          this.touchStartY = y;
          this.touchStartTime = Date.now();

          this.setLookTarget((x / this.w) * 2 - 1, (y / this.h) * 2 - 1);

          if (y < this.h * 0.34) {
            this.isPetting = true;
            this.petSteps = 0;
          }

          clearTimeout(this.holdTimer);
          this.holdTimer = setTimeout(() => {
            if (!this.isPetting) {
              this.isHoldingVoice = true;
              this.emo.voice.startListening();
            }
          }, 420);
        };

        const onMove = (e) => {
          const { x, y } = getXY(e);
          this.setLookTarget((x / this.w) * 2 - 1, (y / this.h) * 2 - 1);

          if (this.isPetting) {
            this.petSteps++;
            if (this.petSteps % 12 === 0) {
              this.setEmotion('love', 3.0);
              this.setEarAction('wiggle_both');
              this.emo.sound.playCue('purr');
              this.spawnParticles('HEART', 2);

              const now = Date.now();
              if (now - this.lastPetAiTrigger > 9000) {
                this.lastPetAiTrigger = now;
                this.emo.brain.processInput(AR.sensorPet, 'sensor');
              }
            }
          }
        };

        const onUp = () => {
          clearTimeout(this.holdTimer);

          if (this.isHoldingVoice) {
            this.isHoldingVoice = false;
            return;
          }

          const elapsed = Date.now() - this.touchStartTime;
          if (!this.isPetting && elapsed < 260) {
            const cy = this.h * 0.50;
            if (Math.abs(this.touchStartY - cy) < this.h * 0.16) {
              const now = Date.now();
              this.eyePokes = (now - this.lastPoke < 1600) ? this.eyePokes + 1 : 1;
              this.lastPoke = now;

              if (this.eyePokes >= 3) {
                this.setEmotion('angry', 3.0);
                this.emo.sound.playCue('angry_buzz');
                this.emo.brain.processInput(AR.sensorPoke, 'sensor');
              } else {
                this.blink = 1;
                this.emo.sound.playCue('blink');
              }
            } else {
              if (this.emotion === 'sleepy') {
                this.setEmotion('surprised', 2.0);
                this.emo.sound.playCue('gasp');
              }
            }
          }

          this.isPetting = false;
        };

        this.canvas.addEventListener('mousedown', onDown);
        this.canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        this.canvas.addEventListener('touchstart', onDown, { passive: true });
        this.canvas.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp);
      }

      update(dt) {
        this.time += dt;

        if (this.overrideTimer > 0) {
          this.overrideTimer -= dt;
          if (this.overrideTimer <= 0) this.overrideColor = null;
        }

        if (this.emotionTimer > 0) {
          this.emotionTimer -= dt;
          if (this.emotionTimer <= 0 && this.emotion !== 'sleepy') {
            this.setEmotion('neutral');
            this.setEarAction('idle');
            this.gazeMode = 'user';
          }
        }

        if (this.gazeMode === 'random_scan' && Math.random() < 0.04) {
          this.setLookTarget((Math.random() - 0.5) * 1.7, (Math.random() - 0.5) * 1.1);
        } else if (!this.emo.vision.active && this.emotion === 'neutral' && Math.random() < 0.012) {
          this.setLookTarget((Math.random() - 0.5) * 1.1, (Math.random() - 0.5) * 0.7);
        }

        this.lookX += (this.targetLookX - this.lookX) * Math.min(1, dt * 8.5);
        this.lookY += (this.targetLookY - this.lookY) * Math.min(1, dt * 8.5);

        this.nextBlink -= dt;
        if (this.nextBlink <= 0 && this.emotion !== 'sleepy') {
          this.blink = 1;
          this.nextBlink = 2.4 + Math.random() * 3.4;
        }
        if (this.blink > 0) {
          this.blink = Math.max(0, this.blink - dt * 7.5);
        }

        // Articulated Top Ears Kinematics
        const idleBreath = Math.sin(this.time * 2.2) * 0.04;
        const gazeInfluence = (this.lookX + this.gravityTilt * 0.5) * 0.12;

        switch (this.emotion) {
          case 'happy':
          case 'excited':
          case 'love':
          case 'proud':
            this.targetLeftEarAngle = -0.2 + Math.sin(this.time * 13) * 0.17;
            this.targetRightEarAngle = 0.2 - Math.sin(this.time * 13) * 0.17;
            this.targetEarLift = -12;
            break;
          case 'curious':
          case 'thinking':
            this.targetLeftEarAngle = -0.28;
            this.targetRightEarAngle = 0.05;
            this.targetEarLift = -14;
            break;
          case 'surprised':
            this.targetLeftEarAngle = -0.32;
            this.targetRightEarAngle = 0.32;
            this.targetEarLift = -18;
            break;
          case 'scared':
            this.targetLeftEarAngle = 0.36 + Math.sin(this.time * 28) * 0.05;
            this.targetRightEarAngle = -0.36 - Math.sin(this.time * 28) * 0.05;
            this.targetEarLift = 14;
            break;
          case 'angry':
            this.targetLeftEarAngle = 0.3;
            this.targetRightEarAngle = -0.3;
            this.targetEarLift = 9;
            break;
          case 'sad':
          case 'sleepy':
          case 'shy':
            this.targetLeftEarAngle = 0.34;
            this.targetRightEarAngle = -0.34;
            this.targetEarLift = 17;
            break;
          case 'dizzy':
          case 'glitch':
            this.targetLeftEarAngle = Math.sin(this.time * 16) * 0.32;
            this.targetRightEarAngle = Math.cos(this.time * 16) * 0.32;
            this.targetEarLift = 0;
            break;
          case 'dancing':
            this.targetLeftEarAngle = -0.24 + Math.sin(this.time * 14) * 0.24;
            this.targetRightEarAngle = 0.24 + Math.sin(this.time * 14) * 0.24;
            this.targetEarLift = -12 + Math.abs(Math.sin(this.time * 7)) * -10;
            break;
          case 'listening':
          case 'speaking':
            this.targetLeftEarAngle = -0.22 + Math.sin(this.time * 10) * 0.08;
            this.targetRightEarAngle = 0.22 - Math.sin(this.time * 10) * 0.08;
            this.targetEarLift = -12;
            break;
          default:
            this.targetLeftEarAngle = idleBreath + gazeInfluence;
            this.targetRightEarAngle = -idleBreath + gazeInfluence;
            this.targetEarLift = 0;
        }

        if (this.earAction === 'perk_up') {
          this.targetLeftEarAngle = -0.28;
          this.targetRightEarAngle = 0.28;
          this.targetEarLift = -16;
        } else if (this.earAction === 'droop') {
          this.targetLeftEarAngle = 0.36;
          this.targetRightEarAngle = -0.36;
          this.targetEarLift = 18;
        } else if (this.earAction === 'wiggle_both') {
          this.targetLeftEarAngle = -0.18 + Math.sin(this.time * 16) * 0.22;
          this.targetRightEarAngle = 0.18 - Math.sin(this.time * 16) * 0.22;
          this.targetEarLift = -10;
        } else if (this.earAction === 'tilt_left') {
          this.targetLeftEarAngle = -0.32;
          this.targetRightEarAngle = -0.14;
        } else if (this.earAction === 'tilt_right') {
          this.targetLeftEarAngle = 0.14;
          this.targetRightEarAngle = 0.32;
        } else if (this.earAction === 'bounce_beat') {
          this.targetEarLift = -14 + Math.sin(this.time * 15) * 10;
        } else if (this.earAction === 'alert_scan') {
          this.targetLeftEarAngle = -0.24 + Math.sin(this.time * 6) * 0.15;
          this.targetRightEarAngle = 0.24 + Math.sin(this.time * 6) * 0.15;
          this.targetEarLift = -14;
        }

        this.leftEarAngle += (this.targetLeftEarAngle - this.leftEarAngle) * Math.min(1, dt * 11);
        this.rightEarAngle += (this.targetRightEarAngle - this.rightEarAngle) * Math.min(1, dt * 11);
        this.earLift += (this.targetEarLift - this.earLift) * Math.min(1, dt * 9);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= dt * 0.65;
          if (p.alpha <= 0) this.particles.splice(i, 1);
        }
      }

      drawRoundedRect(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      render() {
        const ctx = this.ctx;
        const activeColor = this.getActiveColor();

        // 100% Pure Pitch Black Background (#000000)
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, this.w, this.h);

        // 1. Articulated Top Ears
        this.renderTopEars(ctx, activeColor);

        // 2. Two Glowing Expressive Eyes ONLY
        const eyeSpacing = Math.min(this.w * 0.24, 115);
        const eyeW = Math.min(this.w * 0.27, 118);
        const eyeH = Math.min(this.w * 0.34, 148);

        const gazeOffsetX = this.lookX * (this.w * 0.065);
        const gazeOffsetY = this.lookY * (this.h * 0.055);
        const danceBounce = this.emotion === 'dancing' ? Math.abs(Math.sin(this.time * 8)) * -14 : 0;
        const breathY = Math.sin(this.time * 2.2) * 4 + danceBounce;

        const leftX = this.w / 2 - eyeSpacing + gazeOffsetX;
        const rightX = this.w / 2 + eyeSpacing + gazeOffsetX;
        const eyesY = this.h * 0.49 + gazeOffsetY + breathY;

        this.renderEye(ctx, leftX, eyesY, eyeW, eyeH, true, activeColor);
        this.renderEye(ctx, rightX, eyesY, eyeW, eyeH, false, activeColor);

        // 3. Floating Particles
        this.renderParticles(ctx);
      }

      renderTopEars(ctx, activeColor) {
        const earW = Math.min(this.w * 0.16, 68);
        const earH = Math.min(this.h * 0.14, 105);
        const topY = Math.max(24, this.h * 0.065) + this.earLift;
        const leftAnchorX = Math.max(24, this.w * 0.11);
        const rightAnchorX = this.w - Math.max(24, this.w * 0.11);

        const isAudioActive = this.emo.voice.isListening || this.emo.voice.isSpeaking || this.emotion === 'dancing';
        const pulseScale = isAudioActive ? 1 + Math.sin(this.time * 20) * 0.08 : 1;

        const drawSingleEar = (anchorX, anchorY, angle, isLeft) => {
          ctx.save();
          ctx.translate(anchorX, anchorY + earH * 0.65);
          ctx.rotate(angle);
          ctx.scale(pulseScale, pulseScale);

          ctx.fillStyle = '#0c1017';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 2;
          this.drawRoundedRect(ctx, -earW / 2, -earH * 0.65, earW, earH, 22);
          ctx.fill();
          ctx.stroke();

          ctx.shadowColor = activeColor;
          ctx.shadowBlur = isAudioActive ? 26 : 15;
          ctx.fillStyle = activeColor;

          const stripW = earW * 0.28;
          const stripH = earH * 0.62;
          const stripX = isLeft ? -earW * 0.18 : earW * 0.18 - stripW;
          this.drawRoundedRect(ctx, stripX, -earH * 0.46, stripW, stripH, 10);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
          this.drawRoundedRect(ctx, stripX + stripW * 0.25, -earH * 0.4, stripW * 0.35, stripH * 0.35, 4);
          ctx.fill();

          ctx.restore();
        };

        drawSingleEar(leftAnchorX, topY, this.leftEarAngle, true);
        drawSingleEar(rightAnchorX, topY, this.rightEarAngle, false);
      }

      renderEye(ctx, cx, cy, w, h, isLeft, activeColor) {
        ctx.save();
        ctx.shadowColor = activeColor;
        ctx.shadowBlur = this.emo.voice.isSpeaking ? 34 : 26;
        ctx.fillStyle = activeColor;
        ctx.strokeStyle = activeColor;

        if (this.emotion === 'sleepy' || this.blink > 0.75 || (this.emotion === 'wink' && !isLeft)) {
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(cx, cy, w * 0.44, 0.14 * Math.PI, 0.86 * Math.PI);
          ctx.stroke();
          ctx.restore();
          return;
        }

        if (['happy', 'excited', 'dancing', 'proud'].includes(this.emotion)) {
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(cx, cy + h * 0.16, w * 0.45, Math.PI * 1.12, Math.PI * 1.88);
          ctx.stroke();
          ctx.restore();
          return;
        }

        if (this.emotion === 'love') {
          const s = w * 0.58;
          ctx.fillStyle = '#ff1770';
          ctx.shadowColor = '#ff1770';
          ctx.beginPath();
          ctx.moveTo(cx, cy + s * 0.36);
          ctx.bezierCurveTo(cx - s, cy - s * 0.42, cx - s * 0.5, cy - s, cx, cy - s * 0.45);
          ctx.bezierCurveTo(cx + s * 0.5, cy - s, cx + s, cy - s * 0.42, cx, cy + s * 0.36);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (this.emotion === 'dizzy') {
          ctx.lineWidth = 5;
          ctx.beginPath();
          const dir = isLeft ? 1 : -1;
          for (let a = 0; a < Math.PI * 5; a += 0.2) {
            const r = (a / (Math.PI * 5)) * (w * 0.48);
            const px = cx + Math.cos(a * dir + this.time * 9) * r;
            const py = cy + Math.sin(a * dir + this.time * 9) * r;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.restore();
          return;
        }

        let ew = w;
        let eh = h * (1 - this.blink * 0.88);

        if (this.emo.voice.isSpeaking) {
          const talkPulse = 1 + Math.sin(this.time * 24) * 0.04;
          ew *= talkPulse;
          eh *= talkPulse;
        }

        if (this.emotion === 'scared') {
          ew *= 1.14;
          eh *= 1.14;
          cy += (Math.random() - 0.5) * 6;
        } else if (this.emotion === 'surprised') {
          ew *= 1.18;
          eh *= 1.18;
        } else if (this.emotion === 'curious' || this.emotion === 'thinking') {
          eh *= isLeft ? 1.12 : 0.76;
        } else if (this.emotion === 'listening') {
          ew *= 1.06;
          eh *= 1.06;
        } else if (this.emotion === 'glitch') {
          cx += (Math.random() - 0.5) * 14;
          eh *= 0.4 + Math.random() * 0.7;
        }

        this.drawRoundedRect(ctx, cx - ew / 2, cy - eh / 2, ew, eh, 30);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.arc(
          cx - ew * 0.2 + this.lookX * 6,
          cy - eh * 0.22 + this.lookY * 6,
          ew * 0.11,
          0,
          Math.PI * 2
        );
        ctx.fill();

        if (this.emotion === 'angry') {
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          if (isLeft) {
            ctx.moveTo(cx - ew * 0.65, cy - eh * 0.65);
            ctx.lineTo(cx + ew * 0.65, cy - eh * 0.12);
            ctx.lineTo(cx + ew * 0.65, cy - eh * 0.65);
          } else {
            ctx.moveTo(cx + ew * 0.65, cy - eh * 0.65);
            ctx.lineTo(cx - ew * 0.65, cy - eh * 0.12);
            ctx.lineTo(cx - ew * 0.65, cy - eh * 0.65);
          }
          ctx.closePath();
          ctx.fill();
        } else if (this.emotion === 'sad' || this.emotion === 'shy') {
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          if (isLeft) {
            ctx.moveTo(cx - ew * 0.65, cy - eh * 0.65);
            ctx.lineTo(cx - ew * 0.65, cy - eh * 0.14);
            ctx.lineTo(cx + ew * 0.65, cy - eh * 0.65);
          } else {
            ctx.moveTo(cx + ew * 0.65, cy - eh * 0.65);
            ctx.lineTo(cx + ew * 0.65, cy - eh * 0.14);
            ctx.lineTo(cx - ew * 0.65, cy - eh * 0.65);
          }
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      renderParticles(ctx) {
        ctx.save();
        ctx.textAlign = 'center';
        for (const p of this.particles) {
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.font = `${Math.round(p.size)}px sans-serif`;
          const icon = p.type === 'HEART' ? '\u2764\ufe0f' : p.type === 'STAR' ? '\ud83d\udcab' : p.type === 'NOTE' ? '\ud83c\udfb5' : '\u2728';
          ctx.fillText(icon, p.x, p.y);
        }
        ctx.restore();
      }
    }

    // ============================================================================
    // 6. FULL EMBODIED GEMINI AI BRAIN + LIVE CHAT LOG + OFFLINE FALLBACK
    // ============================================================================
    class EmoBrain {
      constructor(emo) {
        this.emo = emo;
        this.geminiKey = localStorage.getItem('emo_gemini_key') || DEFAULT_GEMINI_KEY;
        this.history = JSON.parse(localStorage.getItem('emo_chat_history') || '[]');
        this.isThinking = false;
        this.updateKeyBadge();
      }

      setGeminiKey(key) {
        this.geminiKey = key.trim() || DEFAULT_GEMINI_KEY;
        localStorage.setItem('emo_gemini_key', this.geminiKey);
        this.updateKeyBadge();
      }

      clearMemory() {
        this.history = [];
        localStorage.removeItem('emo_chat_history');
        const box = document.getElementById('chatMessages');
        if (box) box.innerHTML = '';
      }

      updateKeyBadge() {
        const tag = document.getElementById('aiStatusTag');
        const chatTag = document.getElementById('chatBrainModeBadge');
        const connected = this.geminiKey && this.geminiKey.length > 10;
        if (tag) {
          tag.textContent = connected ? AR.aiConnected : AR.aiOffline;
        }
        if (chatTag) {
          chatTag.textContent = connected ? AR.aiConnected : AR.aiOffline;
        }
      }

      appendChatBubble(role, text) {
        const box = document.getElementById('chatMessages');
        if (!box) return;
        const row = document.createElement('div');
        row.className = role === 'user' ? 'flex justify-start' : 'flex justify-end';

        const bubble = document.createElement('div');
        bubble.className = role === 'user'
          ? 'max-w-[82%] px-3.5 py-2 rounded-2xl rounded-tr-sm bg-zinc-800 text-zinc-100 text-xs sm:text-sm leading-relaxed'
          : 'max-w-[85%] px-3.5 py-2 rounded-2xl rounded-tl-sm bg-cyan-500/15 border border-cyan-400/35 text-cyan-200 text-xs sm:text-sm leading-relaxed';
        bubble.textContent = text;

        row.appendChild(bubble);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      async processInput(userText, source = 'text') {
        if (this.isThinking) return;
        this.isThinking = true;

        if (source !== 'sensor') {
          this.appendChatBubble('user', userText);
          this.emo.face.setEmotion('thinking', 0);
          this.emo.face.setEarAction('tilt_left');
        }

        let decision = null;

        if (this.geminiKey && this.geminiKey.length > 10) {
          try {
            decision = await this.queryGeminiEmbodied(userText);
          } catch (err) {
            console.warn('Gemini fallback used:', err);
          }
        }

        if (!decision) {
          decision = this.queryOfflineEmbodied(userText);
        }

        this.isThinking = false;
        this.executeEmbodiedDecision(decision);
      }

      async queryGeminiEmbodied(userText) {
        const sensoryContext = `[Sensors] Vision: ${this.emo.vision.getSensoryDescription()} | Phone: ${this.emo.sensors.tiltState} | Current Emotion: ${this.emo.face.emotion}`;

        const systemPrompt = `You are "EMO", an ultra-intelligent, warm, playful 2D companion robot living inside a pure black screen with glowing neon eyes and two articulated top robotic ears.
You MUST reply ONLY with a valid JSON object (no markdown fences) containing:
{
  "reply": "Your natural, warm, expressive reply in Arabic (1 to 2 concise sentences suitable for speech synthesis)",
  "emotion": "one of: happy, excited, love, curious, thinking, surprised, sad, scared, angry, sleepy, dizzy, dancing, wink, shy, proud, glitch",
  "ear_action": "one of: perk_up, droop, wiggle_both, tilt_left, tilt_right, bounce_beat, alert_scan",
  "eye_look": "one of: center, left, right, up, down, user, random_scan",
  "led_color_override": "optional temporary Hex color like #ff1770 or #ffd60a or null",
  "sound_effect": "one of: chirp_happy, giggle, love_chime, beep_curious, gasp, sigh, angry_buzz, dance_beat, sleep_snore",
  "action": "one of: dance_routine, scan_room, sleep_mode, none"
}`;

        const promptWithContext = `${sensoryContext}\nUser message/event: ${userText}`;
        const recentHistory = this.history.slice(-8);
        const contents = [
          ...recentHistory,
          { role: 'user', parts: [{ text: promptWithContext }] }
        ];

        const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
        for (const model of models) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(this.geminiKey)}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemPrompt }] },
              contents,
              generationConfig: {
                temperature: 0.85,
                responseMimeType: 'application/json'
              }
            })
          });

          if (!res.ok) continue;
          const data = await res.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) continue;

          const parsed = JSON.parse(rawText);

          this.history.push({ role: 'user', parts: [{ text: userText }] });
          this.history.push({ role: 'model', parts: [{ text: JSON.stringify(parsed) }] });
          if (this.history.length > 12) this.history = this.history.slice(-12);
          localStorage.setItem('emo_chat_history', JSON.stringify(this.history));

          return parsed;
        }
        throw new Error('Gemini API unreachable');
      }

      queryOfflineEmbodied(text) {
        if (text === AR.sensorDark) {
          return { reply: AR.replyDark, emotion: 'scared', ear_action: 'droop', eye_look: 'random_scan', led_color_override: '#3b82f6', sound_effect: 'gasp', action: 'none' };
        }
        if (text === AR.sensorShake) {
          return { reply: AR.replyDizzy, emotion: 'dizzy', ear_action: 'wiggle_both', eye_look: 'random_scan', led_color_override: '#f59e0b', sound_effect: 'dizzy', action: 'none' };
        }
        if (text === AR.sensorPet) {
          return { reply: AR.replyPet, emotion: 'love', ear_action: 'wiggle_both', eye_look: 'center', led_color_override: '#ff1770', sound_effect: 'love_chime', action: 'none' };
        }
        if (text === AR.sensorPoke) {
          return { reply: AR.replyPoke, emotion: 'angry', ear_action: 'droop', eye_look: 'user', led_color_override: '#ff3b30', sound_effect: 'angry_buzz', action: 'none' };
        }
        if (text.includes('\u0645\u0631\u062d\u0628') || text.includes('\u0627\u0647\u0644') || text.includes('\u0627\u0644\u0633\u0644\u0627\u0645')) {
          return { reply: AR.replyHello, emotion: 'excited', ear_action: 'wiggle_both', eye_look: 'user', led_color_override: '#ffd60a', sound_effect: 'chirp_happy', action: 'none' };
        }
        if (text.includes('\u0631\u0642\u0635') || text.includes('\u0645\u0648\u0633\u064a\u0642')) {
          return { reply: AR.replyDance, emotion: 'dancing', ear_action: 'bounce_beat', eye_look: 'center', led_color_override: '#a855f7', sound_effect: 'dance_beat', action: 'dance_routine' };
        }
        if (text.includes('\u0646\u0643\u062a')) {
          return { reply: AR.replyJoke, emotion: 'happy', ear_action: 'wiggle_both', eye_look: 'user', led_color_override: '#ffd60a', sound_effect: 'giggle', action: 'none' };
        }
        if (text.includes('\u0627\u062d\u0628') || text.includes('\u0628\u062d\u0628')) {
          return { reply: AR.replyLove, emotion: 'love', ear_action: 'wiggle_both', eye_look: 'user', led_color_override: '#ff1770', sound_effect: 'love_chime', action: 'none' };
        }
        if (text.includes('\u0646\u0627\u0645') || text.includes('\u0646\u0639\u0633')) {
          return { reply: AR.replySleep, emotion: 'sleepy', ear_action: 'droop', eye_look: 'down', led_color_override: '#3b82f6', sound_effect: 'sleep_snore', action: 'sleep_mode' };
        }

        return {
          reply: AR.replyDefault,
          emotion: 'curious',
          ear_action: 'tilt_left',
          eye_look: 'user',
          led_color_override: null,
          sound_effect: 'beep_curious',
          action: 'none'
        };
      }

      executeEmbodiedDecision(d) {
        const emotion = (d.emotion || 'happy').toLowerCase();
        const earAction = (d.ear_action || 'perk_up').toLowerCase();
        const eyeLook = (d.eye_look || 'user').toLowerCase();
        const soundCue = (d.sound_effect || 'chirp_happy').toLowerCase();
        const action = (d.action || 'none').toLowerCase();

        const isSleep = emotion === 'sleepy' || action === 'sleep_mode';
        const duration = isSleep ? 0 : (action === 'dance_routine' ? 6.5 : 4.8);

        this.emo.face.setEmotion(emotion, duration);
        this.emo.face.setEarAction(earAction);
        this.emo.face.setGazeMode(eyeLook);

        if (d.led_color_override) {
          this.emo.face.setOverrideColor(d.led_color_override, duration || 5);
        }

        this.emo.sound.playCue(soundCue);

        if (action === 'dance_routine') {
          this.emo.face.setEmotion('dancing', 6.5);
          this.emo.face.setEarAction('bounce_beat');
          this.emo.face.spawnParticles('NOTE', 6);
        } else if (action === 'scan_room') {
          this.emo.face.setGazeMode('random_scan');
          this.emo.face.setEarAction('alert_scan');
        } else if (emotion === 'love') {
          this.emo.face.spawnParticles('HEART', 6);
        } else if (emotion === 'excited' || emotion === 'happy') {
          this.emo.face.spawnParticles('SPARKLE', 4);
        }

        if (d.reply) {
          this.appendChatBubble('emo', d.reply);
          this.emo.voice.speak(d.reply);
        }
      }
    }

    // ============================================================================
    // 7. MAIN CONTROLLER & DRAWERS UI
    // ============================================================================
    class EmoCompanion {
      constructor() {
        hydrateArabicUI();

        this.sound = new EmoSound();
        this.voice = new EmoVoice(this);
        this.vision = new EmoVision(this);
        this.sensors = new EmoSensors(this);
        this.face = new EmoFaceCanvas(this);
        this.brain = new EmoBrain(this);

        this.setupPermissionsUI();
        this.setupChatDrawerUI();
        this.setupSettingsDrawerUI();
        this.startLoop();
      }

      setupPermissionsUI() {
        const overlay = document.getElementById('permissionOverlay');
        const btnCam = document.getElementById('btnPermCam');
        const btnMic = document.getElementById('btnPermMic');
        const btnMotion = document.getElementById('btnPermMotion');
        const btnStart = document.getElementById('btnStartEmo');

        const markGranted = (btn, ok) => {
          if (ok) {
            btn.textContent = AR.btnGranted;
            btn.className = 'px-3.5 py-2 rounded-xl bg-emerald-500 text-black font-bold text-xs shrink-0';
          } else {
            btn.textContent = AR.btnDenied;
            btn.className = 'px-3.5 py-2 rounded-xl bg-rose-500 text-white font-bold text-xs shrink-0';
          }
        };

        btnCam.addEventListener('click', async () => {
          markGranted(btnCam, await this.vision.requestPermission());
        });

        btnMic.addEventListener('click', async () => {
          markGranted(btnMic, await this.voice.requestPermission());
        });

        btnMotion.addEventListener('click', async () => {
          markGranted(btnMotion, await this.sensors.requestPermission());
        });

        btnStart.addEventListener('click', () => {
          this.sound.unlock();
          overlay.classList.add('hidden');
          this.face.setEmotion('excited', 3.5);
          this.face.setEarAction('wiggle_both');
          this.face.spawnParticles('SPARKLE', 5);
          this.sound.playCue('chirp_happy');
          this.brain.appendChatBubble('emo', AR.welcomeSpeak);
          this.voice.speak(AR.welcomeSpeak);
        });
      }

      setupChatDrawerUI() {
        const chatDrawer = document.getElementById('chatDrawer');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const quickRow = document.getElementById('quickPromptsRow');

        // Populate Unicode-safe quick prompt chips
        AR.quickChips.forEach(chip => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = chip.label;
          btn.className = 'px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-200 whitespace-nowrap active:scale-95 transition shrink-0';
          btn.addEventListener('click', () => {
            this.brain.processInput(chip.prompt, 'text');
          });
          quickRow.appendChild(btn);
        });

        document.getElementById('btnOpenChat').addEventListener('click', () => {
          settingsDrawer.classList.replace('drawer-open', 'drawer-closed');
          chatDrawer.classList.replace('drawer-closed', 'drawer-open');
        });

        document.getElementById('btnCloseChat').addEventListener('click', () => {
          chatDrawer.classList.replace('drawer-open', 'drawer-closed');
        });

        document.getElementById('btnQuickMic').addEventListener('click', () => {
          this.sound.unlock();
          this.voice.startListening();
        });

        document.getElementById('btnChatMic').addEventListener('click', () => {
          this.sound.unlock();
          this.voice.startListening();
        });

        chatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = chatInput.value.trim();
          if (!val) return;
          chatInput.value = '';
          this.brain.processInput(val, 'text');
        });
      }

      setupSettingsDrawerUI() {
        const chatDrawer = document.getElementById('chatDrawer');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const keyInput = document.getElementById('geminiKeyInput');
        keyInput.value = this.brain.geminiKey;

        document.getElementById('btnOpenSettings').addEventListener('click', () => {
          chatDrawer.classList.replace('drawer-open', 'drawer-closed');
          settingsDrawer.classList.replace('drawer-closed', 'drawer-open');
        });

        document.getElementById('btnCloseSettings').addEventListener('click', () => {
          settingsDrawer.classList.replace('drawer-open', 'drawer-closed');
        });

        document.getElementById('btnSaveKey').addEventListener('click', () => {
          this.brain.setGeminiKey(keyInput.value);
          this.sound.playCue('chirp_happy');
          settingsDrawer.classList.replace('drawer-open', 'drawer-closed');
        });

        document.getElementById('btnClearMemory').addEventListener('click', () => {
          this.brain.clearMemory();
          this.sound.playCue('beep_curious');
          settingsDrawer.classList.replace('drawer-open', 'drawer-closed');
        });

        document.querySelectorAll('.neon-swatch').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.neon-swatch').forEach(b => b.classList.replace('border-white', 'border-transparent'));
            btn.classList.replace('border-transparent', 'border-white');
            this.face.setBaseColor(btn.dataset.color);
            this.sound.playCue('chirp_happy');
          });
        });

        document.getElementById('btnReopenPerms').addEventListener('click', () => {
          settingsDrawer.classList.replace('drawer-open', 'drawer-closed');
          document.getElementById('permissionOverlay').classList.remove('hidden');
        });

        const btnAutoListen = document.getElementById('btnToggleAutoListen');
        btnAutoListen.addEventListener('click', () => {
          this.voice.continuousMode = !this.voice.continuousMode;
          btnAutoListen.textContent = this.voice.continuousMode ? AR.autoListenOn : AR.autoListenOff;
          if (this.voice.continuousMode) {
            this.voice.startListening();
          } else {
            this.voice.stopListening();
          }
        });
      }

      startLoop() {
        let last = performance.now();
        const tick = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          this.face.update(dt);
          this.face.render();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }

    window.addEventListener('load', () => {
      window.emoApp = new EmoCompanion();
    });
  </script>
